  </g>
  <text x="92" y="548" fill="#7690ae" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Open source · Apache-2.0 · Python 3.12+ · Linux &amp; macOS</text>
