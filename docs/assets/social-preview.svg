<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Agent Self-Edit Gate</title>
  <desc id="description">A requested edit passes through a guarded write and produces a verifiable receipt.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06141c"/>
      <stop offset="0.55" stop-color="#0b2430"/>
      <stop offset="1" stop-color="#0c3540"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123446"/>
      <stop offset="1" stop-color="#0d2533"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="30" fill="url(#background)"/>
  <circle cx="1110" cy="52" r="230" fill="#22d3ee" opacity="0.12"/>
  <circle cx="1210" cy="620" r="300" fill="#2dd4bf" opacity="0.09"/>
  <circle cx="38" cy="620" r="180" fill="#22d3ee" opacity="0.04"/>

  <text x="64" y="72" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" letter-spacing="1.2">OPEN SOURCE · LOCAL FIRST · EXTERNAL BOUNDARY</text>
  <text x="64" y="156" fill="#f8fafc" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="800" letter-spacing="-2.4">Agent Self-Edit Gate</text>
  <text x="66" y="212" fill="#c4d2e7" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31">Guarded self-edits. Protected authority. Receipts you can verify.</text>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="64" y="286" width="316" height="158" rx="22" fill="url(#panel)" stroke="#2a7890" stroke-width="2"/>
    <circle cx="104" cy="310" r="17" fill="#143955" stroke="#22d3ee" stroke-width="2"/>
    <text x="104" y="318" text-anchor="middle" fill="#a5f3fc" font-size="20" font-weight="800">1</text>
    <text x="222" y="371" text-anchor="middle" fill="#f8fafc" font-size="38" font-weight="750">Requested edit</text>
    <text x="222" y="410" text-anchor="middle" fill="#8fa8c5" font-size="22">agent proposal</text>

    <path d="M380 365 H478" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <path d="M466 354 L480 365 L466 376" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="482" y="286" width="316" height="158" rx="22" fill="url(#panel)" stroke="#2d8190" stroke-width="2"/>
    <circle cx="522" cy="310" r="17" fill="#123f4c" stroke="#2dd4bf" stroke-width="2"/>
    <text x="522" y="318" text-anchor="middle" fill="#99f6e4" font-size="20" font-weight="800">2</text>
    <text x="640" y="371" text-anchor="middle" fill="#f8fafc" font-size="38" font-weight="750">Guarded write</text>
    <text x="640" y="410" text-anchor="middle" fill="#9bc5cf" font-size="22">policy + atomic replace</text>

    <path d="M798 365 H896" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <path d="M884 354 L898 365 L884 376" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="900" y="286" width="316" height="158" rx="22" fill="url(#panel)" stroke="#2a7890" stroke-width="2"/>
    <circle cx="940" cy="310" r="17" fill="#123955" stroke="#67e8f9" stroke-width="2"/>
    <text x="940" y="318" text-anchor="middle" fill="#cffafe" font-size="20" font-weight="800">3</text>
    <text x="1058" y="351" text-anchor="middle" fill="#f8fafc" font-size="37" font-weight="750">Verifiable</text>
    <text x="1058" y="398" text-anchor="middle" fill="#f8fafc" font-size="37" font-weight="750">receipt</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">
    <text x="64" y="529" fill="#67e8f9">MUTABLE BEHAVIOUR</text>
    <circle cx="300" cy="522" r="4" fill="#526b8c"/>
    <text x="320" y="529" fill="#5eead4">PROTECTED AUTHORITY</text>
    <circle cx="565" cy="522" r="4" fill="#526b8c"/>
    <text x="585" y="529" fill="#a5f3fc">HASH-CHAINED RECEIPTS</text>
  </g>
  <text x="64" y="582" fill="#8299b7" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Deterministic policy · no runtime dependencies · Python 3.12+ · Linux &amp; macOS</text>
</svg>
