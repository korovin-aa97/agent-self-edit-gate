  <text x="586" y="210" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="700">Agent Self-Edit Gate</text>
  <text x="590" y="278" fill="#9fb3cc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30">Agents may improve behaviour.</text>
  <text x="590" y="320" fill="#9fb3cc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30">Authority stays protected.</text>
