<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Agent Self-Edit Gate</title>
  <desc id="description">A requested edit passes through a guarded write and produces a verifiable receipt.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#111b3a"/>
      <stop offset="1" stop-color="#24194d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19294b"/>
      <stop offset="1" stop-color="#101b35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="30" fill="url(#background)"/>
  <circle cx="1110" cy="52" r="230" fill="#7c3aed" opacity="0.16"/>
  <circle cx="1210" cy="620" r="300" fill="#14b8a6" opacity="0.09"/>
  <circle cx="38" cy="620" r="180" fill="#22d3ee" opacity="0.04"/>

  <text x="64" y="72" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" letter-spacing="1.2">OPEN SOURCE · LOCAL FIRST · EXTERNAL BOUNDARY</text>
  <text x="64" y="156" fill="#f8fafc" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="800" letter-spacing="-2.4">Agent Self-Edit Gate</text>
  <text x="66" y="212" fill="#c4d2e7" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31">Guarded self-edits. Protected authority. Receipts you can verify.</text>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="64" y="286" width="316" height="158" rx="22" fill="url(#panel)" stroke="#3c5f85" stroke-width="2"/>
    <circle cx="104" cy="326" r="17" fill="#143955" stroke="#22d3ee" stroke-width="2"/>
    <text x="104" y="334" text-anchor="middle" fill="#a5f3fc" font-size="20" font-weight="800">1</text>
    <text x="222" y="365" text-anchor="middle" fill="#f8fafc" font-size="42" font-weight="750">Requested edit</text>
    <text x="222" y="410" text-anchor="middle" fill="#8fa8c5" font-size="22">agent proposal</text>

    <path d="M390 365 H462" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <path d="M450 350 L469 365 L450 380" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="482" y="286" width="316" height="158" rx="22" fill="url(#panel)" stroke="#5b5fb2" stroke-width="2"/>
    <circle cx="522" cy="326" r="17" fill="#28245f" stroke="#a78bfa" stroke-width="2"/>
    <text x="522" y="334" text-anchor="middle" fill="#ddd6fe" font-size="20" font-weight="800">2</text>
    <text x="640" y="365" text-anchor="middle" fill="#f8fafc" font-size="42" font-weight="750">Guarded write</text>
    <text x="640" y="410" text-anchor="middle" fill="#aaa8d9" font-size="22">policy + atomic replace</text>

    <path d="M808 365 H880" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <path d="M868 350 L887 365 L868 380" fill="none" stroke="#a3e635" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="900" y="286" width="316" height="158" rx="22" fill="#182b38" stroke="#65a30d" stroke-width="2"/>
    <circle cx="940" cy="326" r="17" fill="#263d22" stroke="#a3e635" stroke-width="2"/>
    <text x="940" y="334" text-anchor="middle" fill="#d9f99d" font-size="20" font-weight="800">3</text>
    <text x="1058" y="351" text-anchor="middle" fill="#f8fafc" font-size="39" font-weight="750">Verifiable</text>
    <text x="1058" y="398" text-anchor="middle" fill="#f8fafc" font-size="39" font-weight="750">receipt</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">
    <text x="64" y="529" fill="#67e8f9">MUTABLE BEHAVIOUR</text>
    <circle cx="300" cy="522" r="4" fill="#526b8c"/>
    <text x="320" y="529" fill="#c4b5fd">PROTECTED AUTHORITY</text>
    <circle cx="565" cy="522" r="4" fill="#526b8c"/>
    <text x="585" y="529" fill="#bef264">HASH-CHAINED RECEIPTS</text>
  </g>
  <text x="64" y="582" fill="#8299b7" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Deterministic policy · no runtime dependencies · Python 3.12+ · Linux &amp; macOS</text>
</svg>
