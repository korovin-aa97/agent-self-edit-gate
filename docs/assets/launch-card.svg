<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Agent Self-Edit Gate</title>
  <desc id="description">A requested edit passes through a guarded write and produces a verifiable receipt; an external writer boundary is required.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06141c"/>
      <stop offset="0.55" stop-color="#0b2430"/>
      <stop offset="1" stop-color="#0c3540"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123446"/>
      <stop offset="1" stop-color="#0d2533"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="30" fill="url(#background)"/>
  <circle cx="1040" cy="40" r="220" fill="#22d3ee" opacity="0.12"/>
  <circle cx="1140" cy="610" r="285" fill="#2dd4bf" opacity="0.09"/>
  <circle cx="30" cy="620" r="170" fill="#22d3ee" opacity="0.04"/>

  <text x="60" y="68" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="1.1">OPEN SOURCE · NOT A SANDBOX · EXTERNAL BOUNDARY</text>
  <text x="60" y="148" fill="#f8fafc" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" letter-spacing="-2.2">Agent Self-Edit Gate</text>
  <text x="62" y="203" fill="#c4d2e7" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29">Guarded self-edits. Protected authority. Receipts you can verify.</text>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="60" y="270" width="290" height="158" rx="22" fill="url(#panel)" stroke="#2a7890" stroke-width="2"/>
    <circle cx="98" cy="298" r="17" fill="#143955" stroke="#22d3ee" stroke-width="2"/>
    <text x="98" y="306" text-anchor="middle" fill="#a5f3fc" font-size="20" font-weight="800">1</text>
    <text x="205" y="355" text-anchor="middle" fill="#f8fafc" font-size="34" font-weight="750">Requested edit</text>
    <text x="205" y="395" text-anchor="middle" fill="#8fa8c5" font-size="21">agent proposal</text>

    <path d="M350 349 H448" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <path d="M436 338 L450 349 L436 360" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="455" y="270" width="290" height="158" rx="22" fill="url(#panel)" stroke="#2d8190" stroke-width="2"/>
    <circle cx="493" cy="298" r="17" fill="#123f4c" stroke="#2dd4bf" stroke-width="2"/>
    <text x="493" y="306" text-anchor="middle" fill="#99f6e4" font-size="20" font-weight="800">2</text>
    <text x="600" y="355" text-anchor="middle" fill="#f8fafc" font-size="34" font-weight="750">Guarded write</text>
    <text x="600" y="395" text-anchor="middle" fill="#9bc5cf" font-size="20">policy + atomic replace</text>

    <path d="M745 349 H843" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <path d="M831 338 L845 349 L831 360" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="850" y="270" width="290" height="158" rx="22" fill="url(#panel)" stroke="#2a7890" stroke-width="2"/>
    <circle cx="888" cy="298" r="17" fill="#123955" stroke="#67e8f9" stroke-width="2"/>
    <text x="888" y="306" text-anchor="middle" fill="#cffafe" font-size="20" font-weight="800">3</text>
    <text x="995" y="345" text-anchor="middle" fill="#f8fafc" font-size="34" font-weight="750">Verifiable</text>
    <text x="995" y="389" text-anchor="middle" fill="#f8fafc" font-size="34" font-weight="750">receipt</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">
    <text x="60" y="514" fill="#67e8f9">MUTABLE BEHAVIOUR</text>
    <circle cx="270" cy="508" r="4" fill="#526b8c"/>
    <text x="288" y="514" fill="#5eead4">PROTECTED AUTHORITY</text>
    <circle cx="520" cy="508" r="4" fill="#526b8c"/>
    <text x="538" y="514" fill="#a5f3fc">HASH-CHAINED RECEIPTS</text>
  </g>
  <text x="60" y="566" fill="#f8fafc" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700">Requires a sandbox, protected broker, or protected merge-time verifier.</text>
  <text x="60" y="599" fill="#8299b7" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Deterministic policy · no runtime dependencies · Python 3.12+ · Linux &amp; macOS</text>
</svg>
