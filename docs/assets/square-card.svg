<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title description">
  <title id="title">Agent Self-Edit Gate</title>
  <desc id="description">A square campaign card showing mutable behaviour allowed through a gate and protected authority denied.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06141c"/>
      <stop offset="0.56" stop-color="#0b2430"/>
      <stop offset="1" stop-color="#0c3540"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123446"/>
      <stop offset="1" stop-color="#0d2533"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" rx="44" fill="url(#background)"/>
  <circle cx="940" cy="72" r="250" fill="#22d3ee" opacity="0.11"/>
  <circle cx="1020" cy="1010" r="310" fill="#2dd4bf" opacity="0.08"/>
  <circle cx="24" cy="1040" r="210" fill="#22d3ee" opacity="0.04"/>

  <text x="72" y="86" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" letter-spacing="1.2">OPEN SOURCE · LOCAL FIRST</text>
  <text x="72" y="190" fill="#f8fafc" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="800" letter-spacing="-2.4">Agent Self-Edit</text>
  <text x="72" y="276" fill="#f8fafc" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="800" letter-spacing="-2.4">Gate</text>
  <text x="74" y="335" fill="#c4d2e7" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29">Guarded self-edits. Protected authority.</text>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="72" y="410" width="936" height="194" rx="26" fill="url(#panel)" stroke="#2d8190" stroke-width="2"/>
    <circle cx="122" cy="457" r="22" fill="#123f4c" stroke="#2dd4bf" stroke-width="3"/>
    <path d="M111 457 l8 8 16-19" fill="none" stroke="#99f6e4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="168" y="466" fill="#5eead4" font-size="24" font-weight="800" letter-spacing="1">MUTABLE BEHAVIOUR</text>
    <text x="112" y="532" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30">.agents/reviewer.md</text>
    <text x="112" y="574" fill="#9bc5cf" font-size="24">ALLOW · ATOMIC WRITE · RECEIPT</text>

    <rect x="72" y="636" width="936" height="194" rx="26" fill="url(#panel)" stroke="#2a7890" stroke-width="2"/>
    <circle cx="122" cy="683" r="22" fill="#143955" stroke="#67e8f9" stroke-width="3"/>
    <path d="M113 674 l18 18 M131 674 l-18 18" fill="none" stroke="#a5f3fc" stroke-width="5" stroke-linecap="round"/>
    <text x="168" y="692" fill="#67e8f9" font-size="24" font-weight="800" letter-spacing="1">PROTECTED AUTHORITY</text>
    <text x="112" y="758" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30">.github/workflows/**</text>
    <text x="112" y="800" fill="#9bc5cf" font-size="24">DENY · PROTECTED RULE WINS</text>
  </g>

  <text x="72" y="914" fill="#f8fafc" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="750">NOT A SANDBOX</text>
  <text x="72" y="958" fill="#9fb3cb" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Requires an external writer boundary</text>
  <text x="72" y="1016" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">POLICY · ATOMIC REPLACE · HASH-CHAINED RECEIPTS</text>
</svg>
