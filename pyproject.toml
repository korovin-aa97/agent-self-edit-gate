[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-self-edit-gate"
version = "0.1.0"
description = "Policy-enforced self-edit gateway for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Alexander Korovin" }]
keywords = [
  "ai-agents",
  "coding-agents",
  "policy-as-code",
  "agent-security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/korovin-aa97/agent-self-edit-gate"
Documentation = "https://github.com/korovin-aa97/agent-self-edit-gate/tree/main/docs"
Issues = "https://github.com/korovin-aa97/agent-self-edit-gate/issues"
Source = "https://github.com/korovin-aa97/agent-self-edit-gate"

[project.scripts]
selfedit-gate = "selfedit_gate.cli:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/selfedit_gate"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/profiles",
  "/examples",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/selfedit-policy.example.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
