name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run pytest --cov=selfedit_gate --cov-report=term-missing
      - run: uv run bash examples/demo.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --all-groups --locked
      - run: uv build
      - run: uvx --from twine==7.0.0 twine check dist/*.whl dist/*.tar.gz
      - name: Install wheel and source distribution in clean environments
        run: |
          wheel_environment=$(mktemp -d)
          sdist_environment=$(mktemp -d)
          uv venv "$wheel_environment"
          uv venv "$sdist_environment"
          uv pip install --python "$wheel_environment/bin/python" --no-deps dist/*.whl
          uv pip install --python "$sdist_environment/bin/python" --no-deps dist/*.tar.gz
          "$wheel_environment/bin/selfedit-gate" --version
          "$sdist_environment/bin/selfedit-gate" --version
      - run: uv run python -m zipfile --list dist/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
