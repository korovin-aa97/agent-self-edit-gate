name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed release tag"
        required: true
        default: "v0.1.0"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agent-self-edit-gate/
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
