schema_version = 1

[gate]
root = "."
receipt_log = ".selfedit-gate/receipts.jsonl"
max_bytes = 262144
max_changed_bytes = 65536
allow_create = false

[[zones]]
name = "shared-agent-behaviour"
mode = "mutable"
patterns = ["AGENTS.md", ".agents/**/*.md"]
extensions = [".md"]

[[zones]]
name = "gate-and-audit"
mode = "immutable"
patterns = ["selfedit-policy.toml", ".selfedit-gate/**"]

[[zones]]
name = "repository-authority"
mode = "protected"
patterns = [".git/**", ".github/**", "CODEOWNERS"]
